name: 🌐 Language Translation
description: Submit a new translation or language update
title: "[i18n]: "
labels: ["translations", "enhancement"]
assignees:
    - agzes
body:
    - type: markdown
      attributes:
          value: "## Thank you for contributing to OntyTask localization!"
    - type: input
      id: language_name
      attributes:
          label: Language Name
          placeholder: e.g. Français (French), Deutsch (German), Español (Spanish)
      validations:
          required: true
    - type: input
      id: language_code
      attributes:
          label: Language Code
          placeholder: e.g. fr, de, es, ja, pt-BR
      validations:
          required: true
    - type: textarea
      id: json_content
      attributes:
          label: Translation JSON
          description: Translate the values below. Please keep all keys unchanged.
          render: json
          value: |
              {
                "code": "xx",
                "name": "Your Language Name",
                "strings": {
                  "app": "OntyTask",
                  "record": "..."
                }
              }
      validations:
          required: true
    - type: textarea
      id: notes
      attributes:
          label: Extra Notes / Context (optional)
          placeholder: Any details about terminology or wording choices.
