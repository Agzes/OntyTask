name: Verify Translations

on:
    push:
        paths:
            - "src/lang/**"
            - ".github/ISSUE_TEMPLATE/translations.yml"
            - "wiki/Translation-Table.md"
            - "scripts/verify_translations.py"
    pull_request:
        paths:
            - "src/lang/**"
            - ".github/ISSUE_TEMPLATE/translations.yml"
            - "wiki/Translation-Table.md"
            - "scripts/verify_translations.py"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Check Translation Consistency
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Run Translation Verification
              run: python scripts/verify_translations.py
